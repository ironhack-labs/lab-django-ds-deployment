{% extends "predictor/base.html" %}

{% block title %}Iris Prediction{% endblock %}

{% block content %}

<div class="card p-4">

    <div class="text-center mb-4">
        <h1 class="fw-bold">🌸 Iris Flower Prediction</h1>

        <p class="text-muted">
            Enter the measurements of an Iris flower
            to predict its species.
        </p>
    </div>

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'predict' %}">

        {% csrf_token %}

        <div class="row">

            <div class="col-md-6 mb-3">
                <label for="sepal_length" class="form-label">
                    Sepal Length (cm)
                </label>

                <input
                    type="number"
                    step="0.1"
                    min="0"
                    class="form-control"
                    id="sepal_length"
                    name="sepal_length"
                    placeholder="Example: 5.1"
                    required
                >
            </div>

            <div class="col-md-6 mb-3">
                <label for="sepal_width" class="form-label">
                    Sepal Width (cm)
                </label>

                <input
                    type="number"
                    step="0.1"
                    min="0"
                    class="form-control"
                    id="sepal_width"
                    name="sepal_width"
                    placeholder="Example: 3.5"
                    required
                >
            </div>

            <div class="col-md-6 mb-3">
                <label for="petal_length" class="form-label">
                    Petal Length (cm)
                </label>

                <input
                    type="number"
                    step="0.1"
                    min="0"
                    class="form-control"
                    id="petal_length"
                    name="petal_length"
                    placeholder="Example: 1.4"
                    required
                >
            </div>

            <div class="col-md-6 mb-3">
                <label for="petal_width" class="form-label">
                    Petal Width (cm)
                </label>

                <input
                    type="number"
                    step="0.1"
                    min="0"
                    class="form-control"
                    id="petal_width"
                    name="petal_width"
                    placeholder="Example: 0.2"
                    required
                >
            </div>

        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary btn-lg w-100">
                Predict Iris Species
            </button>
        </div>

    </form>

</div>

{% endblock %}
