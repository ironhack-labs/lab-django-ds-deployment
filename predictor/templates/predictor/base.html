<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Iris Flower Predictor{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7fa;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .main-container {
            max-width: 900px;
            margin: 50px auto;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .footer {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                🌸 Iris Flower Predictor
            </a>
        </div>
    </nav>

    <main class="container main-container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>
            Django Machine Learning Project |
            Data Analytics Bootcamp
        </p>
    </footer>

</body>
</html>
