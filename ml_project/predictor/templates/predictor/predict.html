{% extends 'predictor/base.html' %}

{% block title %}Prediction - ML Predictor{% endblock %}

{% block content %}
  <h1 class="mb-4">Prediction result</h1>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  {% if prediction %}
    <div class="alert alert-success">Prediction: <strong>{{ prediction }}</strong></div>
  {% endif %}

  <a class="btn btn-secondary" href="{% url 'predictor:home' %}">Back</a>

{% endblock %}
