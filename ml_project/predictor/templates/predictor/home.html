{% extends 'predictor/base.html' %}

{% block title %}Home - ML Predictor{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Enter Features for Prediction</h2>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if prediction %}
            <div class="alert alert-success">
                <strong>Prediction:</strong> {{ prediction }}
            </div>
        {% endif %}

        <form method="post" action="{% url 'home' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="feature1" class="form-label">Feature 1</label>
                <input type="text" class="form-control" id="feature1" name="feature1" value="{{ inputs.feature1 }}" required>
            </div>
            <div class="mb-3">
                <label for="feature2" class="form-label">Feature 2</label>
                <input type="text" class="form-control" id="feature2" name="feature2" value="{{ inputs.feature2 }}" required>
            </div>
            <div class="mb-3">
                <label for="feature3" class="form-label">Feature 3</label>
                <input type="text" class="form-control" id="feature3" name="feature3" value="{{ inputs.feature3 }}" required>
            </div>
            <div class="mb-3">
                <label for="feature4" class="form-label">Feature 4</label>
                <input type="text" class="form-control" id="feature4" name="feature4" value="{{ inputs.feature4 }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>
    </div>
</div>
{% endblock %}
